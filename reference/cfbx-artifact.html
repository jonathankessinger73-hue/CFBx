<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFBx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E141B;
    --bg-panel: #161D27;
    --bg-panel-alt: #1C2531;
    --bg-card-hover: #202A37;
    --border: #2A3441;
    --text: #ECEFE7;
    --text-muted: #8993A3;
    --text-faint: #5C6472;
    --accent: #E8A33D;
    --accent-soft: rgba(232,163,61,0.14);
    --positive: #4CAF6D;
    --positive-soft: rgba(76,175,109,0.14);
    --negative: #E2574C;
    --negative-soft: rgba(226,87,76,0.14);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --font-body: 'Inter', -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{
    height:100%;
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }
  a{color:inherit;}

  /* ---------- Ticker tape ---------- */
  .tape-wrap{
    background: #0A0F14;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    white-space: nowrap;
    padding: 8px 0;
  }
  .tape{
    display: inline-flex;
    animation: scroll-left 34s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .tape{ animation: none; }
    .tape-wrap{ overflow-x: auto; }
  }
  @keyframes scroll-left{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }
  .tape-item{
    display:inline-flex;
    align-items:baseline;
    gap:6px;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 0 20px;
    border-right: 1px solid var(--border);
  }
  .tape-item .tk{ color: var(--text); font-weight:600; }
  .tape-item .px{ color: var(--text-muted); }
  .tape-item .ch.up{ color: var(--positive); }
  .tape-item .ch.down{ color: var(--negative); }

  /* ---------- Header ---------- */
  header.app-header{
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap: 10px;
  }
  .brand .mark{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.3px;
  }
  .brand .mark span{ color: var(--accent); }
  .brand .tag{
    font-size: 12.5px;
    color: var(--text-muted);
  }
  nav.tabs{
    display:flex;
    gap: 4px;
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  nav.tabs button{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text-muted);
    background: transparent;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  nav.tabs button.active{
    background: var(--bg-card-hover);
    color: var(--text);
  }
  .acct{
    display:flex;
    gap: 22px;
    align-items:center;
  }
  .acct .stat{ text-align:right; }
  .acct .stat .label{
    font-size: 11px;
    color: var(--text-faint);
    text-transform: lowercase;
  }
  .acct .stat .value{
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
  }

  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }

  .section-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }
  .section-head h1{
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .section-head p{
    margin:0;
    color: var(--text-muted);
    font-size: 13.5px;
  }
  .btn-primary{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    background: var(--accent);
    color: #221806;
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-primary:hover{ filter: brightness(1.06); }
  .btn-secondary{
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13.5px;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-secondary:hover{ color: var(--text); border-color: var(--text-faint); }

  /* ---------- Market grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }
  .card{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--tag-color, var(--accent));
    border-radius: 10px;
    padding: 16px 16px 14px;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.12s ease;
  }
  .card:hover{ background: var(--bg-card-hover); transform: translateY(-1px); }
  .card-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .card-top .tk{
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 15px;
  }
  .card-top .nm{
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 2px;
    max-width: 140px;
  }
  .card-top .held-badge{
    font-size: 10.5px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 7px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .card-mid{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 10px;
  }
  .card-mid .px{
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
  }
  .card-mid .ch{
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
  }
  .ch.up{ color: var(--positive); background: var(--positive-soft); }
  .ch.down{ color: var(--negative); background: var(--negative-soft); }
  .ch.flat{ color: var(--text-muted); background: var(--bg-panel-alt); }
  .spark{ display:block; width:100%; height:36px; }
  .cover-tag{
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 5px;
    display: inline-block;
    margin-top: 4px;
  }
  .cover-tag.covered{ color: var(--positive); background: var(--positive-soft); }
  .cover-tag.missed{ color: var(--accent); background: var(--accent-soft); }

  /* ---------- Detail view ---------- */
  .detail-back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color: var(--text-muted);
    font-size: 13.5px;
    background:none;
    border:none;
    cursor:pointer;
    padding: 0 0 16px;
  }
  .detail-back:hover{ color: var(--text); }
  .detail-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap: 20px;
    margin-bottom: 22px;
  }
  .detail-head .tk-name .tk{
    font-family: var(--font-mono);
    font-size: 15px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .detail-head .tk-name h1{
    font-family: var(--font-display);
    font-size: 26px;
    margin: 3px 0 0;
  }
  .detail-price{ text-align: right; }
  .detail-price .px{
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 600;
  }
  .detail-price .ch{
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
  }
  .detail-body{
    display:grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 22px;
  }
  @media (max-width: 780px){ .detail-body{ grid-template-columns: 1fr; } }
  .panel{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 18px 16px;
  }
  .panel h2{
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    text-transform: lowercase;
    color: var(--text-muted);
    margin: 0 0 14px;
    letter-spacing: 0.3px;
  }
  .chart-wrap{ overflow-x:auto; }
  .chart-wrap svg{ display:block; }
  .axis-label{ font-family: var(--font-mono); font-size: 10.5px; fill: var(--text-faint); }

  .log-list{ display:flex; flex-direction:column; gap:10px; max-height: 260px; overflow-y:auto; }
  .log-item{
    font-size: 13px;
    color: var(--text-muted);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .log-item:last-child{ border-bottom:none; padding-bottom:0; }
  .log-item .lw{ color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; }
  .log-item .ld{ font-family: var(--font-mono); font-weight: 600; }

  .trade-form{ display:flex; flex-direction:column; gap:12px; }
  .trade-row{ display:flex; gap:10px; }
  .trade-row input[type="number"]{
    flex:1;
    background: var(--bg-panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 10px 12px;
  }
  .trade-row input[type="number"]:focus{ outline: 1px solid var(--accent); border-color: var(--accent); }
  .trade-summary{
    display:flex;
    justify-content:space-between;
    font-size: 13px;
    color: var(--text-muted);
  }
  .trade-summary strong{ color: var(--text); font-family: var(--font-mono); }
  .trade-buttons{ display:flex; gap:10px; }
  .trade-buttons button{ flex:1; }
  .btn-buy{
    background: var(--positive); color: #0c1f14; border:none; font-weight:700;
    padding: 11px; border-radius: 8px; cursor:pointer; font-size: 14px;
  }
  .btn-sell{
    background: var(--negative-soft); color: var(--negative); border: 1px solid var(--negative);
    font-weight:700; padding: 11px; border-radius: 8px; cursor:pointer; font-size: 14px;
  }
  .btn-buy:disabled, .btn-sell:disabled{ opacity: 0.4; cursor: not-allowed; }
  .position-note{
    font-size: 12.5px; color: var(--text-muted); padding-top:2px;
  }

  /* ---------- Portfolio ---------- */
  table.holdings{ width:100%; border-collapse: collapse; }
  table.holdings th{
    text-align: left;
    font-size: 11px;
    text-transform: lowercase;
    color: var(--text-faint);
    font-weight: 600;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
  }
  table.holdings td{
    font-family: var(--font-mono);
    font-size: 13.5px;
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
  }
  table.holdings td.nm-cell{ font-family: var(--font-body); }
  table.holdings td.nm-cell .tk-mini{ color: var(--text-muted); font-family: var(--font-mono); font-size: 11.5px; }
  table.holdings tr:last-child td{ border-bottom:none; }
  .empty-state{
    padding: 40px 20px;
    text-align:center;
    color: var(--text-muted);
  }
  .empty-state .big{
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .summary-row{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 640px){ .summary-row{ grid-template-columns: 1fr; } }
  .summary-card{
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .summary-card .label{ font-size: 12px; color: var(--text-muted); margin-bottom:6px; }
  .summary-card .val{ font-family: var(--font-mono); font-size: 22px; font-weight: 600; }

  footer.simfoot{
    text-align:center;
    color: var(--text-faint);
    font-size: 12px;
    padding: 30px 20px 10px;
  }
</style>
</head>

    {week:15,home:"ARMY",away:"NAVY",line:-2.5},
  ];


  function helmetSVG(primary, secondary, size){
    size = size || 56;
    var h = Math.round(size*0.72);
    return '' +
    '<svg width="' + size + '" height="' + h + '" viewBox="0 0 120 90" aria-hidden="true">' +
      '<path d="M15,55 C15,20 45,10 70,10 C95,10 105,30 103,45 C101,58 90,63 79,60 L77,49 C76,43 69,39 59,39 L34,39 C24,39 19,45 17,55 Z" fill="' + primary + '"/>' +
      '<path d="M69,10 C81,10 88,16 92,24" stroke="' + secondary + '" stroke-width="6" fill="none" stroke-linecap="round"/>' +
      '<circle cx="86" cy="43" r="5" fill="' + secondary + '"/>' +
      '<path d="M19,49 Q11,56 17,66" stroke="#9AA0A6" stroke-width="4.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M26,46 Q17,55 24,68" stroke="#9AA0A6" stroke-width="4.5" fill="none" stroke-linecap="round"/>' +
      '<path d="M33,44 Q24,53 31,66" stroke="#9AA0A6" stroke-width="4.5" fill="none" stroke-linecap="round"/>' +
    '</svg>';
  }

  var state = null;
  var searchDebounceTimer = null;

  function freshState(){
    var teams = {};
    SEED_TEAMS.forEach(function(t){
      teams[t.id] = {
        id: t.id, name: t.name, conf: t.conf, strength: t.strength,
        mascot: MASCOTS[t.id] || "",
        primary: t.primary, secondary: t.secondary,
        price: t.price, lastChangePct: 0,
        history: [t.price],
        log: []
      };
    });

    state = {
      cash: STARTING_CASH,
      week: 0,
      holdings: {},
      newsFeed: [],
      teams: teams,
      view: { tab: "market", ticker: null, conf: "all", q: "", priceMode: "week" }
    };

    var sorted = REAL_RESULTS_2026.slice().sort(function(a,b){ return a.week - b.week; });
    sorted.forEach(function(res){
      if(res.week > state.week) state.week = res.week;
      applyRealResult(res);
    });

    return state;
  }

  function applyRealResult(res){
    var home = state.teams[res.home], away = state.teams[res.away];
    if(!home || !away) return;
    var realLine = (typeof res.line === "number") ? res.line : null;
    var impact = computePriceImpact(res.home, res.homeScore, res.away, res.awayScore, realLine);

    var homeWon = res.homeScore > res.awayScore;
    var winnerId = homeWon ? res.home : res.away, loserId = homeWon ? res.away : res.home;
    var winner = state.teams[winnerId], loser = state.teams[loserId];
    var winnerScore = homeWon ? res.homeScore : res.awayScore;
    var loserScore = homeWon ? res.awayScore : res.homeScore;
    var winnerPct = winnerId===res.home ? impact.pctA : impact.pctB;
    var loserPct = loserId===res.home ? impact.pctA : impact.pctB;
    var winnerPhrase = winnerId===res.home ? impact.phraseA : impact.phraseB;
    var loserPhrase = loserId===res.home ? impact.phraseA : impact.phraseB;

    var winText = winner.name + " def. " + loser.name + " " + winnerScore + "-" + loserScore + " (" + winnerPhrase + ")";
    var loseText = loser.name + " fell to " + winner.name + " " + loserScore + "-" + winnerScore + " (" + loserPhrase + ")";
    addLog(winnerId, res.week, winText, winnerPct);
    addLog(loserId, res.week, loseText, loserPct);
    state.newsFeed.unshift({ week: res.week, ticker: winnerId, text: winText + " \u2014 " + fmtPct(winnerPct) });
    if(winner.strength < loser.strength){
      state.newsFeed.unshift({ week: res.week, ticker: winnerId, text: "Upset alert: " + winText });
    } else if(winnerPct < 0){
      state.newsFeed.unshift({ week: res.week, ticker: winnerId, text: winner.name + " survive vs " + loser.name + ", but shares slide anyway" });
    }
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.teams) return parsed;
      }
    }catch(e){}
    return freshState();
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function round2(n){ return Math.round(n*100)/100; }
  function fmtMoney(n){ return "$" + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
  function fmtPct(n){ return (n>=0?"+":"") + n.toFixed(2) + "%"; }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  /* ---------- Simulation ---------- */
  var SPREAD_FACTOR = 0.75; // approx. expected point spread per point of strength difference

  function applyPriceChange(ticker, pct){
    var t = state.teams[ticker];
    var newPrice = Math.max(3, round2(t.price * (1 + pct/100)));
    t.lastChangePct = round2(((newPrice - t.price) / t.price) * 100);
    t.price = newPrice;
    t.history.push(newPrice);
    if(t.history.length > 30) t.history.shift();
  }

  function addLog(ticker, week, text, delta){
    var t = state.teams[ticker];
    t.log.unshift({ week: week, text: text, delta: delta });
    if(t.log.length > 20) t.log.pop();
  }

  // Price movement is signed purely by whether a team beat or missed its
  // OWN expected spread - not by whether it technically won the game.
  // A heavy favorite that barely wins can still see its price drop (it
  // "missed the line"); a slight underdog that wins big jumps hard even
  // though it was still "supposed to" possibly lose.
  function spreadPhrase(expectedMargin, actualMargin){
    var favored = expectedMargin >= 0;
    var lineText = favored
      ? ("favored by " + Math.abs(expectedMargin).toFixed(1))
      : ("underdog by " + Math.abs(expectedMargin).toFixed(1));
    var resultText = actualMargin >= 0
      ? ("won by " + actualMargin)
      : ("lost by " + Math.abs(actualMargin));
    var covered = actualMargin >= expectedMargin;
    return lineText + ", " + resultText + " \u2014 " + (covered ? "covered" : "missed the line");
  }

  function computePriceImpact(idA, scoreA, idB, scoreB, realLineForA){
    var a = state.teams[idA], b = state.teams[idB];
    var isReal = typeof realLineForA === "number";
    var expectedMarginA = isReal ? realLineForA : (a.strength - b.strength) * SPREAD_FACTOR;
    var actualMarginA = scoreA - scoreB;
    var edge = actualMarginA - expectedMarginA; // + = A beat its spread, - = A missed it
    var magnitude = Math.abs(edge);
    var baseMove = Math.min(28, 0.15 + magnitude * 0.32);
    var pctA = round2((edge >= 0 ? 1 : -1) * baseMove + (Math.random()-0.5)*0.6);
    var pctB = round2((edge >= 0 ? -1 : 1) * baseMove + (Math.random()-0.5)*0.6);
    applyPriceChange(idA, pctA);
    applyPriceChange(idB, pctB);

    a.lastCovered = edge >= 0;
    a.lastExpected = round2(expectedMarginA);
    a.lastActual = actualMarginA;
    a.lastLineIsReal = isReal;
    b.lastCovered = edge <= 0;
    b.lastExpected = round2(-expectedMarginA);
    b.lastActual = -actualMarginA;
    b.lastLineIsReal = isReal;

    return {
      pctA: pctA, pctB: pctB, edge: edge, isReal: isReal,
      phraseA: spreadPhrase(expectedMarginA, actualMarginA),
      phraseB: spreadPhrase(-expectedMarginA, -actualMarginA)
    };
  }

  // aId/bId are treated as home/away when a real matchup is passed in (realLine
  // set from the real posted spread, home-perspective). For the no-schedule-data
  // fallback, aId/bId are just two shuffled teams with no home/away meaning and
  // realLine is left undefined, so the SP+ proxy is used instead.
  function playMatch(aId, bId, week, realLine){
    var a = state.teams[aId], b = state.teams[bId];
    var isReal = typeof realLine === "number";
    var expectedMarginA = isReal ? realLine : (a.strength - b.strength) * SPREAD_FACTOR;
    var actualMarginA = Math.round(expectedMarginA + (Math.random()-0.5)*32);
    if(actualMarginA === 0) actualMarginA = Math.random() < 0.5 ? 1 : -1;

    var baseScore = 20 + Math.floor(Math.random()*8);
    var aScore, bScore;
    if(actualMarginA >= 0){ aScore = baseScore + actualMarginA; bScore = baseScore; }
    else { bScore = baseScore + Math.abs(actualMarginA); aScore = baseScore; }

    var impact = computePriceImpact(aId, aScore, bId, bScore, isReal ? realLine : undefined);

    var aWins = aScore > bScore;
    var winnerId = aWins ? aId : bId, loserId = aWins ? bId : aId;
    var winner = state.teams[winnerId], loser = state.teams[loserId];
    var winnerFinal = aWins ? aScore : bScore, loserFinal = aWins ? bScore : aScore;
    var winnerPct = winnerId===aId ? impact.pctA : impact.pctB;
    var loserPct = loserId===aId ? impact.pctA : impact.pctB;
    var winnerPhrase = winnerId===aId ? impact.phraseA : impact.phraseB;
    var loserPhrase = loserId===aId ? impact.phraseA : impact.phraseB;
    var tag = isReal ? " [real line]" : " [projected]";

    var winText = winner.name + " def. " + loser.name + " " + winnerFinal + "-" + loserFinal + " (" + winnerPhrase + ")" + tag;
    var loseText = loser.name + " fall to " + winner.name + " " + loserFinal + "-" + winnerFinal + " (" + loserPhrase + ")" + tag;

    addLog(winnerId, week, winText, winnerPct);
    addLog(loserId, week, loseText, loserPct);

    state.newsFeed.unshift({ week: week, ticker: winnerId, text: winText + " \u2014 " + fmtPct(winnerPct) });
    if(winner.strength < loser.strength){
      state.newsFeed.unshift({ week: week, ticker: winnerId, text: "Upset alert: " + winText });
    } else if(winnerPct < 0){
      state.newsFeed.unshift({ week: week, ticker: winnerId, text: winner.name + " survive vs " + loser.name + ", but shares slide anyway" });
    }
  }

  function simulateWeek(){
    var nextWeek = state.week + 1;
    state.week = nextWeek;
    var weekGames = REAL_SCHEDULE_2026.filter(function(g){ return g.week === nextWeek; });

    if(weekGames.length){
      weekGames.forEach(function(g){
        if(state.teams[g.home] && state.teams[g.away]){
          playMatch(g.home, g.away, nextWeek, typeof g.line === "number" ? g.line : undefined);
        }
      });
    } else {
      // No real schedule data for this far out - fall back to a fully
      // algorithmic slate so the app never just stalls.
      var ids = shuffle(Object.keys(state.teams));
      for(var i=0;i<ids.length;i+=2){
        if(ids[i+1]) playMatch(ids[i], ids[i+1], nextWeek);
      }
    }
    if(state.newsFeed.length > 40) state.newsFeed.length = 40;
    saveState();
    render();
  }


  /* ---------- Trading ---------- */
  function buy(ticker, qty){
    qty = Math.floor(qty);
    if(!qty || qty < 1) return;
    var t = state.teams[ticker];
    var cost = round2(t.price * qty);
    if(cost > state.cash) return;
    state.cash = round2(state.cash - cost);
    var h = state.holdings[ticker] || { shares:0, avgCost:0 };
    var totalCost = h.avgCost*h.shares + cost;
    h.shares += qty;
    h.avgCost = round2(totalCost / h.shares);
    state.holdings[ticker] = h;
    saveState();
    render();
  }

  function sell(ticker, qty){
    qty = Math.floor(qty);
    var h = state.holdings[ticker];
    if(!h || !qty || qty < 1 || qty > h.shares) return;
    var t = state.teams[ticker];
    var proceeds = round2(t.price * qty);
    state.cash = round2(state.cash + proceeds);
    h.shares -= qty;
    if(h.shares <= 0) delete state.holdings[ticker];
    saveState();
    render();
  }

  /* ---------- Rendering helpers ---------- */
  function netWorth(){
    var v = state.cash;
    Object.keys(state.holdings).forEach(function(tk){
      v += state.teams[tk].price * state.holdings[tk].shares;
    });
    return round2(v);
  }

  function sparklinePath(history, w, h, pad){
    pad = pad || 3;
    var hist = history.length > 1 ? history : [history[0], history[0]];
    var min = Math.min.apply(null, hist), max = Math.max.apply(null, hist);
    var range = (max - min) || 1;
    var step = (w - 2*pad) / (hist.length - 1);
    return hist.map(function(v,i){
      var x = pad + i*step;
      var y = h - pad - ((v - min)/range) * (h - 2*pad);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
  }

  function seasonPct(t){
    var base = t.history[0];
    if(!base) return 0;
    return round2(((t.price - base) / base) * 100);
  }

  function renderTape(){
    var teamList = Object.values(state.teams);
    var items = teamList.map(function(t){
      var dir = t.lastChangePct > 0 ? "up" : t.lastChangePct < 0 ? "down" : "flat";
      var arrow = t.lastChangePct > 0 ? "\u25B2" : t.lastChangePct < 0 ? "\u25BC" : "\u2013";
      return '<span class="tape-item"><span class="tk">' + t.id + '</span>' +
        '<span class="px">' + t.price.toFixed(2) + '</span>' +
        '<span class="ch ' + dir + '">' + arrow + ' ' + Math.abs(t.lastChangePct).toFixed(2) + '%</span></span>';
    }).join("");
    var tape = document.getElementById("tape");
    tape.innerHTML = items + items;
    tape.style.animationDuration = Math.max(34, teamList.length * 2.6) + "s";
  }

  function renderHeaderStats(){
    document.getElementById("hdr-cash").textContent = fmtMoney(state.cash);
    document.getElementById("hdr-networth").textContent = fmtMoney(netWorth());
  }

  /* ---------- Views ---------- */
  function renderMarket(){
    var all = Object.values(state.teams);
    var confs = [];
    all.forEach(function(t){ if(confs.indexOf(t.conf) === -1) confs.push(t.conf); });
    confs.sort();

    var q = (state.view.q || "").toLowerCase();
    var confFilter = state.view.conf || "all";
    var teams = all.filter(function(t){
      var matchesConf = confFilter === "all" || t.conf === confFilter;
      var matchesQ = !q || t.name.toLowerCase().indexOf(q) !== -1 || t.id.toLowerCase().indexOf(q) !== -1 || (t.mascot||"").toLowerCase().indexOf(q) !== -1;
      return matchesConf && matchesQ;
    }).sort(function(a,b){ return b.price - a.price; });

    var confOptions = '<option value="all">All conferences</option>' + confs.map(function(c){
      return '<option value="' + c + '"' + (c===confFilter?' selected':'') + '>' + c + '</option>';
    }).join("");

    var mode = state.view.priceMode || "week";
    var cards = teams.map(function(t){
      var pct = mode === "season" ? seasonPct(t) : t.lastChangePct;
      var dir = pct > 0 ? "up" : pct < 0 ? "down" : "flat";
      var held = state.holdings[t.id];
      var badge = held ? '<span class="held-badge">' + held.shares + ' sh</span>' : "";
      var path = sparklinePath(t.history, 220, 36);
      var strokeColor = t.history[t.history.length-1] >= t.history[0] ? "var(--positive)" : "var(--negative)";
      var coverTag = (mode === "week" && typeof t.lastCovered === "boolean")
        ? '<span class="cover-tag ' + (t.lastCovered ? "covered" : "missed") + '">' + (t.lastCovered ? "COVERED" : "MISSED LINE") + '</span>'
        : "";
      return '' +
      '<div class="card" style="--tag-color:' + t.primary + '" data-ticker="' + t.id + '">' +
        '<div class="card-top">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            helmetSVG(t.primary, t.secondary, 44) +
            '<div><div class="tk">' + t.id + '</div><div class="nm">' + t.name + (t.mascot ? ' ' + t.mascot : '') + '</div></div>' +
          '</div>' +

        '</div>' +
        '<svg class="spark" viewBox="0 0 220 36" preserveAspectRatio="none">' +
          '<polyline points="' + path + '" fill="none" stroke="' + strokeColor + '" stroke-width="2"/>' +
        '</svg>' +
      '</div>';
    }).join("");

    var emptyState = !teams.length ? '<div class="panel"><div class="empty-state">No programs match that search.</div></div>' : "";

    var html = '' +
    '<div class="section-head">' +
      '<div><h1>Market \u2014 Week ' + state.week + '</h1><p>' + all.length + ' programs, ranked by current price. Tap a card to trade.</p></div>' +
      '<button class="btn-primary" id="btn-sim-week">Play Week ' + (state.week+1) + '</button>' +
    '</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center">' +
      '<input type="text" id="mkt-search" placeholder="Search team, mascot, or ticker\u2026" value="' + (state.view.q||"") + '" style="flex:1;min-width:180px;background:var(--bg-panel-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:9px 12px">' +
      '<select id="mkt-conf" style="background:var(--bg-panel-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13.5px;padding:9px 10px">' + confOptions + '</select>' +
      '<nav class="tabs" id="mkt-pricemode">' +
        '<button data-mode="week" class="' + (mode==="week"?"active":"") + '">This Week</button>' +
        '<button data-mode="season" class="' + (mode==="season"?"active":"") + '">Season</button>' +
      '</nav>' +
    '</div>' +
    '<div class="grid">' + cards + '</div>' + emptyState;

    document.getElementById("main").innerHTML = html;
    document.getElementById("btn-sim-week").addEventListener("click", simulateWeek);
    document.getElementById("mkt-search").addEventListener("input", function(e){
      var pos = e.target.selectionStart;
      var val = e.target.value;
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(function(){
        state.view.q = val;
        render();
        var newInput = document.getElementById("mkt-search");
        if(newInput){
          newInput.focus();
          newInput.setSelectionRange(pos, pos);
        }
      }, 180);
    });
    document.getElementById("mkt-conf").addEventListener("change", function(e){
      state.view.conf = e.target.value; render();
    });
    document.querySelectorAll("#mkt-pricemode button").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.view.priceMode = btn.getAttribute("data-mode"); render();
      });
    });
    document.querySelectorAll(".card").forEach(function(card){
      card.addEventListener("click", function(){
        state.view.tab = "detail";
        state.view.ticker = card.getAttribute("data-ticker");
        render();
      });
    });
  }

  function renderDetail(ticker){

      var y = h - pad - ((v-min)/range)*(h-2*pad);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    var lineColor = hist[hist.length-1] >= hist[0] ? "var(--positive)" : "var(--negative)";

    var logItems = t.log.length ? t.log.map(function(l){

      : 'No position yet.';

    var html = '' +
    '<button class="detail-back" id="btn-back">&larr; Back to market</button>' +
    '<div class="detail-head">' +
      '<div style="display:flex;align-items:center;gap:16px">' +
        helmetSVG(t.primary, t.secondary, 84) +

        (mode === "week" && typeof t.lastCovered === "boolean"
          ? '<div class="cover-tag ' + (t.lastCovered ? "covered" : "missed") + '">' + (t.lastCovered ? "COVERED" : "MISSED LINE") + '</div>' +
            '<div class="position-note" style="margin-top:4px">Expected ' + (t.lastExpected>=0?"+":"") + t.lastExpected.toFixed(1) + ' \u00b7 Actual ' + (t.lastActual>=0?"+":"") + t.lastActual + (t.lastLineIsReal ? ' (real line)' : ' (projected)') + '</div>'
          : '') +
      '</div>' +
    '</div>' +
    '<div class="detail-body">' +
      '<div class="panel"><h2>price history</h2><div class="chart-wrap">' + chart + '</div></div>' +
      '<div class="panel">' +
        '<h2>trade</h2>' +
        '<div class="trade-form">' +
          '<div class="trade-row"><input type="number" id="trade-qty" min="1" step="1" placeholder="Shares" value="1"></div>' +
          '<div class="trade-summary"><span>Est. cost</span><strong id="trade-cost">$' + t.price.toFixed(2) + '</strong></div>' +
          '<div class="trade-buttons">' +
            '<button class="btn-buy" id="btn-buy">Buy</button>' +
            '<button class="btn-sell" id="btn-sell"' + (heldShares<1?' disabled':'') + '>Sell</button>' +
          '</div>' +
          '<div class="position-note">' + positionNote + '</div>' +
          '<div class="position-note">Buying power: $' + state.cash.toFixed(2) + ' (~' + maxAffordable + ' sh)</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="panel" style="margin-top:16px"><h2>game log</h2><div class="log-list">' + logItems + '</div></div>';

    document.getElementById("main").innerHTML = html;

    document.getElementById("btn-back").addEventListener("click", function(){
      state.view.tab = "market"; render();
    });
    document.querySelectorAll("#detail-pricemode button").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.view.priceMode = btn.getAttribute("data-mode"); render();
      });
    });

    var qtyInput = document.getElementById("trade-qty");
    function refreshCost(){
      var q = parseInt(qtyInput.value, 10) || 0;
      document.getElementById("trade-cost").textContent = "$" + (q*t.price).toFixed(2);
      document.getElementById("btn-buy").disabled = (q < 1) || (q*t.price > state.cash);
      var sellBtn = document.getElementById("btn-sell");
      sellBtn.disabled = (q < 1) || (q > heldShares);
    }
    qtyInput.addEventListener("input", refreshCost);
    refreshCost();

    document.getElementById("btn-buy").addEventListener("click", function(){
      buy(ticker, parseInt(qtyInput.value,10) || 0);
    });
    document.getElementById("btn-sell").addEventListener("click", function(){
      sell(ticker, parseInt(qtyInput.value,10) || 0);
    });
  }

  function renderPortfolio(){
    var rows = Object.keys(state.holdings);
    var nw = netWorth();
    var totalReturn = round2(nw - STARTING_CASH);
    var totalReturnPct = round2((totalReturn/STARTING_CASH)*100);

    var summary = '' +
    '<div class="summary-row">' +
      '<div class="summary-card"><div class="label">net worth</div><div class="val">' + fmtMoney(nw) + '</div></div>' +
      '<div class="summary-card"><div class="label">cash available</div><div class="val">' + fmtMoney(state.cash) + '</div></div>' +
      '<div class="summary-card"><div class="label">total return</div><div class="val ch ' + (totalReturn>=0?'up':'down') + '" style="background:none;padding:0">' + (totalReturn>=0?'+':'') + fmtMoney(totalReturn) + ' (' + fmtPct(totalReturnPct) + ')</div></div>' +
    '</div>';

    var body;
    if(!rows.length){
      body = '<div class="panel"><div class="empty-state"><div class="big">No positions yet</div>Head to the market and buy your first shares.</div></div>';
    } else {
      var trs = rows.map(function(tk){
        var h = state.holdings[tk];
        var t = state.teams[tk];
        var val = round2(h.shares * t.price);
        var gl = round2(val - h.shares*h.avgCost);
        var glPct = round2((gl/(h.shares*h.avgCost))*100);
        var dir = gl >= 0 ? "up" : "down";
        return '<tr>' +
          '<td class="nm-cell">' + t.name + '<br><span class="tk-mini">' + tk + '</span></td>' +
          '<td>' + h.shares + '</td>' +
          '<td>$' + h.avgCost.toFixed(2) + '</td>' +
          '<td>$' + t.price.toFixed(2) + '</td>' +
          '<td>$' + val.toFixed(2) + '</td>' +
          '<td class="ch ' + dir + '" style="background:none;padding:0">' + (gl>=0?'+':'') + '$' + Math.abs(gl).toFixed(2) + ' (' + fmtPct(glPct) + ')</td>' +
        '</tr>';
      }).join("");
      body = '<div class="panel"><table class="holdings">' +
        '<thead><tr><th>program</th><th>shares</th><th>avg cost</th><th>price</th><th>value</th><th>gain / loss</th></tr></thead>' +
        '<tbody>' + trs + '</tbody></table></div>';
    }

    document.getElementById("main").innerHTML =
      '<div class="section-head"><div><h1>Portfolio</h1><p>Started with ' + fmtMoney(STARTING_CASH) + ' in play money.</p></div></div>' +
      summary + body;
  }

  function render(){
    renderTape();
    renderHeaderStats();
    document.getElementById("tab-market").classList.toggle("active", state.view.tab === "market" || state.view.tab === "detail");
    document.getElementById("tab-portfolio").classList.toggle("active", state.view.tab === "portfolio");

    if(state.view.tab === "market") renderMarket();
    else if(state.view.tab === "detail") renderDetail(state.view.ticker);
    else if(state.view.tab === "portfolio") renderPortfolio();
  }

  document.getElementById("tab-market").addEventListener("click", function(){
    state.view.tab = "market"; render();
  });
  document.getElementById("tab-portfolio").addEventListener("click", function(){
    state.view.tab = "portfolio"; render();
  });

  state = loadState();
  render();

})();
</script>
</body>
</html>
