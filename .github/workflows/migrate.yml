name: Migrate database

# Applies any new db/migrations/*.sql to the database (same as running
# `npm run migrate` on your computer). Safe to run any time: migrations that
# already ran are skipped. Actions -> Migrate database -> Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: cfbd-sync # never at the same time as the market jobs
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ vars.CFBX_JOB_ENVIRONMENT || 'staging' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL secret is not set for this environment."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node scripts/migrate.js
      - run: echo "Done. Lines above starting with 'applied' are the migrations that just ran; none means it was already up to date."
